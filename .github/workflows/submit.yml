name: "Submit to Web Store"
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm-lock.yaml 是 lockfileVersion 6，对应 pnpm 8
      - uses: pnpm/action-setup@v4
        with:
          version: 8

      # 原来是 16.x：Plasmo 0.88 在上面装不起来，而且 Actions 端早已弃用
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 服务端地址逻辑自检
        run: node tools/test-servers.mjs

      - name: 构建扩展
        run: pnpm build
        env:
          # 留空也没关系：finalize 会把没替换成功的占位符和空串一起删掉。
          # 拿到固定的公钥后填进仓库 secrets，扩展 ID 就不会每次都变。
          CRX_PUBLIC_KEY: ${{ secrets.CRX_PUBLIC_KEY }}

      # 少了这一步，提交上去的 zip 里会带 "key": "$CRX_PUBLIC_KEY"，
      # Chrome 商店会因为 key 不是合法 base64 公钥而拒收整个包。
      - name: 收尾：清掉未替换的 manifest 占位符
        run: node tools/finalize-extension.mjs build/chrome-mv3-prod

      - name: 打包
        run: pnpm package

      - name: Browser Platform Publish
        uses: PlasmoHQ/bpp@v3
        with:
          keys: ${{ secrets.SUBMIT_KEYS }}
          artifact: build/chrome-mv3-prod.zip
