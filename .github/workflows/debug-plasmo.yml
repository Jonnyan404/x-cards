name: Debug plasmo popup
on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: 实验 0：现状（完整 popup，预期失败）
        run: |
          set +e
          rm -rf .plasmo build
          pnpm build 2>&1 | tail -3
          echo "实验0 exit=${PIPESTATUS[0]}"

      - name: 实验 1：最小 popup，不 import 任何东西
        run: |
          set +e
          rm -rf .plasmo build
          cat > src/popup.tsx <<'EOF'
          const P = () => <div style={{ width: 380, padding: 16 }}>hello</div>
          export default P
          EOF
          pnpm build 2>&1 | tail -3
          echo "实验1 exit=${PIPESTATUS[0]}"

      - name: 实验 2：只 import config
        run: |
          set +e
          rm -rf .plasmo build
          cat > src/popup.tsx <<'EOF'
          import { OFFICIAL_SERVER } from "@src/config/servers"
          const P = () => <div style={{ width: 380, padding: 16 }}>{OFFICIAL_SERVER.url}</div>
          export default P
          EOF
          pnpm build 2>&1 | tail -3
          echo "实验2 exit=${PIPESTATUS[0]}"

      - name: 实验 3：import 浏览器 polyfill
        run: |
          set +e
          rm -rf .plasmo build
          cat > src/popup.tsx <<'EOF'
          import Browser from "webextension-polyfill"
          const P = () => <div style={{ width: 380, padding: 16 }}>{typeof Browser.storage}</div>
          export default P
          EOF
          pnpm build 2>&1 | tail -3
          echo "实验3 exit=${PIPESTATUS[0]}"

      - name: 实验 4：用 tabs 页面（非 popup 入口）
        run: |
          set +e
          rm -rf .plasmo build
          rm -f src/popup.tsx
          mkdir -p src/tabs
          cat > src/tabs/servers.tsx <<'EOF'
          import { OFFICIAL_SERVER } from "@src/config/servers"
          const P = () => <div style={{ width: 380, padding: 16 }}>{OFFICIAL_SERVER.url}</div>
          export default P
          EOF
          pnpm build 2>&1 | tail -3
          echo "实验4 exit=${PIPESTATUS[0]}"
          echo "=== manifest 里有没有 tabs 页面 ==="
          ls build/chrome-mv3-prod 2>/dev/null | head -20
