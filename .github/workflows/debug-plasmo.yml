name: Debug plasmo popup
on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 构建并列出产物
        run: |
          set +e
          pnpm build
          echo "build exit=$?"
          echo "=== 所有 html ==="
          find build/chrome-mv3-prod -name "*.html" | sort
          echo "=== manifest ==="
          cat build/chrome-mv3-prod/manifest.json
