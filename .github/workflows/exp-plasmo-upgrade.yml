name: "Exp plasmo upgrade"
on:
  workflow_dispatch:

jobs:
  # 每个组合独立跑：装指定版本的 plasmo，放最小 popup，看构建结果
  exp:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "0.88.0 + .parcelrc"
            plasmo: "0.88.0"
          - label: "0.90.5 + .parcelrc"
            plasmo: "0.90.5"
    name: ${{ matrix.label }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: 装依赖
        run: pnpm install --frozen-lockfile

      - name: 装指定版本的 plasmo
        run: |
          pnpm add -D plasmo@${{ matrix.plasmo }}
          node -p "'plasmo=' + require('./node_modules/plasmo/package.json').version"

      # issue #1331 的做法：Parcel 默认 resolver 处理不了，显式指定它
      - name: 加 .parcelrc
        run: |
          pnpm add -D @parcel/config-default@2.9.3 @parcel/resolver-default@2.9.3
          cat > .parcelrc <<'EOF'
          {
            "extends": "@parcel/config-default",
            "resolvers": ["@parcel/resolver-default"]
          }
          EOF
          cat .parcelrc

      - name: 放一个最小 popup 进 src
        run: |
          cat > src/popup.tsx <<'EOF'
          import { useState } from "react";
          export default function IndexPopup() {
            const [n] = useState(1);
            return <div style={{ width: 200 }}>popup ok {n}</div>;
          }
          EOF

      - name: 构建（允许失败）
        id: b
        continue-on-error: true
        run: pnpm build

      - name: 结论
        run: |
          echo "### ${{ matrix.label }} => 构建 ${OUTCOME}"
          if [ -f build/chrome-mv3-prod/manifest.json ]; then
            python3 -c "import json;m=json.load(open('build/chrome-mv3-prod/manifest.json'));print('default_popup =', m.get('action',{}).get('default_popup'))"
            find build/chrome-mv3-prod -maxdepth 1 -name '*.html'
          else
            echo "manifest 不存在 => 构建失败"
          fi
        env:
          OUTCOME: ${{ steps.b.outcome }}
