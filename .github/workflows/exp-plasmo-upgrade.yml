name: "Exp plasmo upgrade"
on:
  workflow_dispatch:

jobs:
  exp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: 装依赖
        run: pnpm install --frozen-lockfile

      # 不新增 popup 入口，让 manifest 直接指向已经构建出来的 tabs 页面
      - name: 给 manifest 加 default_popup
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open('package.json'))
          m = d.setdefault('manifest', {})
          m['action'] = {'default_popup': './tabs/servers.html'}
          json.dump(d, open('package.json', 'w'), indent=2, ensure_ascii=False)
          print('manifest =', json.dumps(d['manifest'], ensure_ascii=False))
          PY

      - name: 构建
        id: b
        continue-on-error: true
        run: pnpm build

      - name: 结论
        run: |
          echo "构建 = ${OUTCOME}"
          ls -la build/chrome-mv3-prod | head -20
          if [ -f build/chrome-mv3-prod/manifest.json ]; then
            python3 -c "import json;m=json.load(open('build/chrome-mv3-prod/manifest.json'));print('action =', json.dumps(m.get('action')))"
          fi
          echo "--- tabs 目录 ---"
          ls -la build/chrome-mv3-prod/tabs
        env:
          OUTCOME: ${{ steps.b.outcome }}
